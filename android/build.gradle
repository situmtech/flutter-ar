group 'com.situm.flutter.ar.situm_ar'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.24'
    //ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.situm.flutter.ar.situm_ar'
    }

    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
//        implementation 'io.github.sceneview:arsceneview:2.1.1'  //2.2.1
        // Situm
        implementation('es.situm:situm-sdk:3.17.1@aar') {
            transitive = true
        }
        implementation 'com.google.ar:core:1.43.0'
        implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
        //implementation files('libs/sceneview-release.aar')
        //implementation files('libs/arsceneview-release.aar')

        // Android KTX
        implementation "androidx.fragment:fragment-ktx:1.7.1"

        // Compose
        implementation "androidx.compose.ui:ui:1.6.7"
        implementation "androidx.compose.foundation:foundation:1.6.7"

        // kotlin-math
        api 'dev.romainguy:kotlin-math:1.5.3'

        // Filament
        def filament_version = '1.52.0'
        api "com.google.android.filament:filament-android:$filament_version"
        api "com.google.android.filament:gltfio-android:$filament_version"
        api "com.google.android.filament:filament-utils-android:$filament_version"

        // Fuel
        implementation "com.github.kittinunf.fuel:fuel:2.3.1"
        implementation "com.github.kittinunf.fuel:fuel-android:2.3.1"
        implementation "com.github.kittinunf.fuel:fuel-coroutines:2.3.1"


    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
